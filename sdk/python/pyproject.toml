[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tft-insight-sdk"
version = "0.1.0"
description = "SDK Python oficial para a TFT Insight API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "TFT Insight" }
]
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.6,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/tft_insight"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
